name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Includes src/lib/wasm-solver/engine.test.ts, which solves real spots with the committed wasm module.
      - run: npx vitest run
      - run: npm run build

  solver-wasm:
    name: Rebuild solver wasm and compare
    # The published module embeds remapped source paths with Windows separators, so it is rebuilt on Windows.
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the pinned Rust toolchain
        working-directory: tools/dcfr-wasm
        run: rustup toolchain install
      - name: Rust tests (dcfr-core, dcfr-wasm)
        working-directory: tools/dcfr-wasm
        run: cargo test --release --locked --workspace
      - name: Native adapter tests (real rayon, --json mode)
        working-directory: tools/dcfr-adapter
        run: cargo test --release --locked
      - name: Preflop solver tests (6/8-max rules, export)
        working-directory: tools/rangelab-preflop
        run: cargo test --release --locked
      - name: Rebuild wasm, checksum, and license notices
        run: node scripts/build-solver-wasm.mjs
      - name: Fail if the committed module is stale
        run: git diff --exit-code -- public/solver
